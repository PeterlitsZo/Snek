[package]
name = "snek"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A collection of practical utilities with a TypeScript scripting runtime"

[dependencies]
anyhow = "1.0"
aws-credential-types = "1.2.14"
aws-sigv4 = "1.4.5"
boa_engine = { version = "0.22.0", default-features = false }
boa_gc = "0.22.0"
boa_runtime = { version = "0.22.0", default-features = false }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
http = "1"
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
indoc = "2.0.8"
oxc = { version = "0.151.0", features = ["codegen", "semantic", "transformer"] }
percent-encoding = "2"
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "process", "time", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
