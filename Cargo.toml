[package]
name = "snek"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A collection of practical utilities with a TypeScript scripting runtime"

[dependencies]
anyhow = "1.0"
boa_engine = { version = "0.22.0", default-features = false }
boa_runtime = { version = "0.22.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
oxc = { version = "0.151.0", features = ["codegen", "semantic", "transformer"] }
tokio = { version = "1", features = ["rt", "process", "time"] }

[lints.rust]
unsafe_code = "forbid"
